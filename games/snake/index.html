<!DOCTYPE html>
<html>
<head>
  <title>Neon Snake</title>
  <style>
    body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #fff; font-family: sans-serif; }
    canvas { border: 2px solid #4caf50; background: #111; }
    p { margin-top: 10px; color: #aaa; }
  </style>
</head>
<body>
  <h2 id="score">Score: 0</h2>
  <canvas id="game" width="400" height="400"></canvas>
  <p>Use Arrow Keys to move</p>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const grid = 20;
    let snake = [{x: 160, y: 160}], dx = grid, dy = 0, food = {x: 80, y: 80}, score = 0;

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' && dx === 0) { dx = -grid; dy = 0; }
      if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -grid; }
      if (e.key === 'ArrowRight' && dx === 0) { dx = grid; dy = 0; }
      if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = grid; }
    });

    setInterval(() => {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};
      if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400 || snake.some(s => s.x === head.x && s.y === head.y)) {
        snake = [{x: 160, y: 160}]; dx = grid; dy = 0; score = 0;
        document.getElementById('score').innerText = 'Score: 0';
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').innerText = 'Score: ' + score;
        food = {x: Math.floor(Math.random()*20)*grid, y: Math.floor(Math.random()*20)*grid};
      } else {
        snake.pop();
      }
      ctx.clearRect(0, 0, 400, 400);
      ctx.fillStyle = '#ff5252';
      ctx.fillRect(food.x, food.y, grid-2, grid-2);
      ctx.fillStyle = '#4caf50';
      snake.forEach(s => ctx.fillRect(s.x, s.y, grid-2, grid-2));
    }, 100);
  </script>
</body>
</html>
