<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Arcade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🕹️ My Arcade</h1>
    <button id="back-btn" onclick="closeGame()">← Back to Games</button>
  </header>

  <main>
    <!-- Game Selection Grid (Populated automatically via JS) -->
    <div class="grid" id="menu"></div>

    <!-- Game Screen -->
    <iframe id="player" allowfullscreen></iframe>
  </main>

  <script>
    // Fetch and render the games from your JSON file on page load
    async function loadGames() {
      const menu = document.getElementById('menu');

      try {
        // Make sure 'games.json' matches the exact name/path of your file
        const response = await fetch('games.json');
        if (!response.ok) throw new Error('Could not load games.json');
        
        const games = await response.json();

        games.forEach(game => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => launch(game.path);

          card.innerHTML = `
            <div class="badge">${game.badge}</div>
            <h3>${game.title}</h3>
            <p>${game.description}</p>
          `;

          menu.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        menu.innerHTML = `<p>Failed to load games. Make sure you are running this on a local server.</p>`;
      }
    }

    function launch(path) {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('back-btn').style.display = 'inline-block';
      const player = document.getElementById('player');
      player.src = path;
      player.style.display = 'block';
    }

    function closeGame() {
      const player = document.getElementById('player');
      player.src = '';
      player.style.display = 'none';
      document.getElementById('back-btn').style.display = 'none';
      document.getElementById('menu').style.display = 'grid';
    }

    // Run on startup
    loadGames();
  </script>

</body>
</html>
